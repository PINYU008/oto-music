<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17191f"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.png"><title>音日｜離線音樂</title><style>
*{box-sizing:border-box}body{margin:0;background:#17191f;color:#f5f3ef;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:760px;margin:auto;padding:25px 20px 200px}h1{font-size:32px;margin:0}small,.muted{color:#a8aab5}button,input,select{font:inherit}button,select{background:#30333d;color:inherit;border:0;border-radius:13px;padding:11px 14px;cursor:pointer}button.active{background:#b9e4ca;color:#17251d}button:disabled{opacity:.4}header,.row{display:flex;align-items:center;gap:10px}header{justify-content:space-between}nav{display:flex;gap:8px;margin:24px 0;flex-wrap:wrap}.hero{background:#252932;border-radius:24px;padding:24px;margin:20px 0}.hero h2{margin:8px 0}input[type=search]{width:100%;border:0;border-radius:12px;padding:13px;background:#252932;color:inherit}#list{margin-top:12px}.track{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #30333d}.track .info{flex:1;min-width:0;cursor:pointer}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tile{background:#384c46;color:#d6f3df;border-radius:12px;width:46px;height:46px;display:grid;place-items:center;font-size:22px;flex-shrink:0}.track.current .name{color:#b9e4ca}.player{position:fixed;bottom:0;left:0;right:0;background:#252932;border-top:1px solid #424651;padding:12px 20px calc(14px + env(safe-area-inset-bottom));z-index:4}.inner{max-width:720px;margin:auto}.controls{display:flex;justify-content:center;align-items:center;gap:12px}.controls button{min-width:43px}.play{background:#b9e4ca;color:#17251d;font-size:22px}input[type=range]{width:100%;accent-color:#b9e4ca}.times{display:flex;justify-content:space-between;font-size:12px;color:#aaa}#status{font-size:13px;min-height:20px;color:#b9e4ca}dialog{background:#252932;color:white;border:1px solid #555;border-radius:20px;max-width:90%;width:360px}dialog input{width:100%;padding:12px;margin:12px 0}dialog::backdrop{background:#0009}body.light{background:#f7f6f0;color:#212521}body.light .hero,body.light .player,body.light input[type=search],body.light button,body.light select{background:#e5e9e1;color:#212521}body.light button.active,body.light .play{background:#b9e4ca}body.light .muted,body.light small{color:#59645d}body.light #status{color:#38684d}body.light .track.current .name{color:#28734a}.tiny{font-size:13px;padding:8px}#title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#empty{padding:30px;text-align:center;color:#a8aab5}</style></head><body><main><header><div><small>YOUR MUSIC, YOUR SPACE</small><h1>音日 <span style="color:#9ac7ae">♫</span></h1></div><button id="theme" aria-label="切換外觀">◐</button></header><section class="hero"><small>私人音樂空間</small><h2>今天想聽什麼？</h2><p class="muted" id="count">尚未匯入音樂</p><button class="active" id="import">＋ 匯入音樂</button> <button id="newlist">＋ 播放清單</button><input type="file" id="files" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg,.opus,.aiff" multiple hidden><p id="status" role="status"></p></section><nav id="nav"></nav><input type="search" id="search" placeholder="搜尋歌曲或檔名"><div class="row" style="margin-top:12px"><button id="playall">▶ 播放全部</button><button id="randomall">⤨ 隨機播放</button><button id="removeList" hidden>刪除清單</button></div><div id="list"></div><p class="muted" style="font-size:13px">音樂保存在此裝置的網站資料中，不會上傳。請保留原始音樂檔案；清除網站資料可能移除音樂。</p></main><div class="player"><div class="inner"><div class="row"><div class="tile">♫</div><div style="flex:1;min-width:0"><div id="title">尚未播放</div><small id="sub">選擇一首歌曲</small></div><button id="fav" aria-label="最愛">♡</button></div><input id="seek" type="range" min="0" max="100" value="0" step="0.1" aria-label="播放進度"><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button id="shuffle" aria-label="隨機播放">⤨</button><button id="prev" aria-label="上一首">|◀</button><button id="play" class="play" aria-label="播放或暫停">▶</button><button id="next" aria-label="下一首">▶|</button><button id="repeat" aria-label="循環模式">↻</button><button id="sleep" aria-label="睡眠定時">☾</button></div></div></div><audio id="audio" preload="metadata"></audio><dialog id="dlg"><form method="dialog"><h3 id="dlgTitle"></h3><div id="dlgBody"></div><button value="cancel">取消</button> <button value="ok" class="active">確認</button></form></dialog><script>
const $=id=>document.getElementById(id),a=$('audio');let db,tracks=[],lists=[],view='all',current=null,queue=[],shuffle=false,repeat=0,url='',timer,dlgAction;let prefs={};try{prefs=JSON.parse(localStorage.getItem('oto-prefs')||'{}')}catch{};function save(){try{localStorage.setItem('oto-prefs',JSON.stringify(prefs))}catch{}}if(prefs.light)document.body.classList.add('light');function status(t){$('status').textContent=t}function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function write(n,fn){return new Promise((res,rej)=>{let tx=db.transaction(n,'readwrite');fn(tx.objectStore(n));tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}async function refresh(){tracks=await req(store('tracks').getAll());lists=await req(store('lists').getAll());render()}async function init(){let r=indexedDB.open('oto-music',1);r.onupgradeneeded=()=>{r.result.createObjectStore('tracks',{keyPath:'id'});r.result.createObjectStore('lists',{keyPath:'id'})};try{db=await req(r);await refresh();if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});status('可以匯入本機音樂')}catch(e){status('無法開啟本機資料庫：'+e.message)}}function id(){return globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()}function btn(t,fn,cls='tiny'){let b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=fn;return b}function visible(){let ts=tracks;if(view==='fav')ts=ts.filter(t=>t.fav);else if(view!=='all'){let l=lists.find(l=>l.id===view);ts=(l?.ids||[]).map(i=>tracks.find(t=>t.id===i)).filter(Boolean)}let q=$('search').value.toLowerCase();return ts.filter(t=>t.name.toLowerCase().includes(q))}function render(){ $('count').textContent=tracks.length+' 首歌曲 · '+lists.length+' 個播放清單';let n=$('nav');n.replaceChildren();for(let [i,t] of [['all','所有歌曲'],['fav','我的最愛'],...lists.map(l=>[l.id,l.name])])n.append(btn(t,()=>{view=i;render()},i===view?'active':''));$('removeList').hidden=['all','fav'].includes(view);let el=$('list');el.replaceChildren();let ts=visible();if(!ts.length){let p=document.createElement('p');p.id='empty';p.textContent='這裡還沒有歌曲';el.append(p)}for(let t of ts){let row=document.createElement('div');row.className='track'+(current===t.id?' current':'');let tile=document.createElement('div');tile.className='tile';tile.textContent='♫';let info=document.createElement('div');info.className='info';let name=document.createElement('div');name.className='name';name.textContent=t.name;let sm=document.createElement('small');sm.textContent=(t.blob.size/1048576).toFixed(1)+' MB';info.append(name,sm);info.onclick=()=>{queue=ts.map(x=>x.id);load(t.id)};row.append(tile,info,btn(t.fav?'♥':'♡',()=>toggleFav(t.id)),btn('⋯',()=>trackMenu(t)));el.append(row)}$('fav').textContent=tracks.find(t=>t.id===current)?.fav?'♥':'♡';$('shuffle').classList.toggle('active',shuffle);$('repeat').classList.toggle('active',repeat>0);$('repeat').textContent=repeat===2?'↻1':'↻';}
function modal(title,content,action){$('dlgTitle').textContent=title;$('dlgBody').replaceChildren(content);dlgAction=action;$('dlg').returnValue='';$('dlg').showModal()}$('dlg').onclose=()=>{if($('dlg').returnValue==='ok')Promise.resolve(dlgAction?.()).catch(e=>status(e.message))};function trackMenu(t){let s=document.createElement('select');s.style.width='100%';for(let [v,l] of [...lists.map(l=>['add:'+l.id,'加入 '+l.name]),...(!['all','fav'].includes(view)?[['remove','從此清單移除']]:[]),['rename','重新命名'],['delete','刪除音樂']]){let o=document.createElement('option');o.value=v;o.textContent=l;s.append(o)}modal(t.name,s,async()=>{if(s.value==='delete'){if(!confirm('確定刪除此音樂？'))return;if(current===t.id){a.pause();a.removeAttribute('src');a.load();current=null;$('title').textContent='尚未播放';$('sub').textContent='選擇一首歌曲';if(url)URL.revokeObjectURL(url);url=''}await write('tracks',o=>o.delete(t.id));for(let l of lists){l.ids=l.ids.filter(i=>i!==t.id);await write('lists',o=>o.put(l))}}else if(s.value==='rename'){let n=prompt('歌曲名稱',t.name);if(n?.trim()){t.name=n.trim();await write('tracks',o=>o.put(t));if(current===t.id)$('title').textContent=t.name}}else{let l=lists.find(l=>l.id===(s.value==='remove'?view:s.value.slice(4)));if(l){l.ids=s.value==='remove'?l.ids.filter(i=>i!==t.id):[...new Set([...l.ids,t.id])];await write('lists',o=>o.put(l))}}await refresh()})}async function toggleFav(i){let t=tracks.find(t=>t.id===i);if(t){t.fav=!t.fav;await write('tracks',o=>o.put(t));render()}}$('import').onclick=()=>$('files').click();$('files').onchange=async e=>{if(!db)return status('資料庫尚未就緒');let added=0,skipped=0;try{for(let f of e.target.files){if(tracks.some(t=>t.original===f.name&&t.blob.size===f.size&&t.modified===f.lastModified)){skipped++;continue}let t={id:id(),name:f.name.replace(/\.[^.]+$/,''),original:f.name,modified:f.lastModified,blob:f,fav:false};await write('tracks',o=>o.put(t));tracks.push(t);added++;status('已匯入 '+added+' 首')}await refresh();status('已匯入 '+added+' 首，略過 '+skipped+' 首重複檔案')}catch(err){status('匯入中止：'+err.message);await refresh()}e.target.value=''};$('newlist').onclick=()=>{let i=document.createElement('input');i.placeholder='播放清單名稱';modal('新增播放清單',i,async()=>{if(i.value.trim()){let l={id:id(),name:i.value.trim(),ids:[]};await write('lists',o=>o.put(l));view=l.id;await refresh()}})};$('removeList').onclick=async()=>{if(confirm('刪除播放清單？歌曲會保留。')){await write('lists',o=>o.delete(view));view='all';await refresh()}};$('search').oninput=render;
function play(){a.play().catch(e=>status('無法播放：'+e.message))}function load(i){let t=tracks.find(t=>t.id===i);if(!t)return;current=i;a.pause();if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(t.blob);a.src=url;$('title').textContent=t.name;$('sub').textContent='本機音樂';if('mediaSession'in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:t.name,artist:'本機音樂',album:'音日'})}catch{}}render();play()}function step(d,ended=false){let q=queue.filter(i=>tracks.some(t=>t.id===i));if(!q.length)return;if(ended&&repeat===2){a.currentTime=0;play();return}let idx=q.indexOf(current),j=idx+d;if(shuffle&&d>0&&q.length>1){let choices=q.filter(i=>i!==current);load(choices[Math.floor(Math.random()*choices.length)]);return}if(j>=q.length||j<0){if(repeat===1||!ended)j=(j+q.length)%q.length;else return}load(q[j])}function all(random){queue=visible().map(t=>t.id);if(queue.length){shuffle=random;load(queue[random?Math.floor(Math.random()*queue.length):0])}}$('playall').onclick=()=>all(false);$('randomall').onclick=()=>all(true);$('play').onclick=()=>current?(a.paused?play():a.pause()):all(false);$('prev').onclick=()=>{if(a.currentTime>3)a.currentTime=0;else step(-1)};$('next').onclick=()=>step(1);$('shuffle').onclick=()=>{shuffle=!shuffle;render()};$('repeat').onclick=()=>{repeat=(repeat+1)%3;render()};$('fav').onclick=()=>toggleFav(current);a.onended=()=>step(1,true);a.onplay=()=>{$('play').textContent='Ⅱ';if('mediaSession'in navigator)navigator.mediaSession.playbackState='playing'};a.onpause=()=>{$('play').textContent='▶';if('mediaSession'in navigator)navigator.mediaSession.playbackState='paused'};a.onerror=()=>status('此音樂格式可能不受目前瀏覽器支援');function fmt(s){return Number.isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00'}function time(){ $('elapsed').textContent=fmt(a.currentTime);$('duration').textContent=fmt(a.duration);$('seek').value=a.duration?100*a.currentTime/a.duration:0}a.ontimeupdate=time;a.onloadedmetadata=time;$('seek').oninput=()=>{if(Number.isFinite(a.duration))a.currentTime=a.duration*$('seek').value/100};if('mediaSession'in navigator){for(let [k,f] of Object.entries({play,pause:()=>a.pause(),previoustrack:()=>step(-1),nexttrack:()=>step(1),seekto:e=>{if(Number.isFinite(e.seekTime))a.currentTime=e.seekTime}})){try{navigator.mediaSession.setActionHandler(k,f)}catch{}}}$('sleep').onclick=()=>{let s=document.createElement('select');for(let m of [0,15,30,45,60,90]){let o=document.createElement('option');o.value=m;o.textContent=m?m+' 分鐘':'關閉定時';s.append(o)}modal('睡眠定時',s,()=>{clearTimeout(timer);let m=Number(s.value);$('sleep').classList.toggle('active',!!m);if(m)timer=setTimeout(()=>{a.pause();$('sleep').classList.remove('active')},m*60000)})};$('theme').onclick=()=>{prefs.light=document.body.classList.toggle('light');save()};init();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>status('離線快取尚未成功，請確認 HTTPS 環境'));
</script></body></html>

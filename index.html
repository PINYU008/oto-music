const $=id=>document.getElementById(id),a=$('audio');let db,tracks=[],lists=[],view='all',current=null,queue=[],queueBase=[],shuffle=false,repeat=0,url='',timer,dlgAction;let limit=100, searchTimer, sleepUntil=0, playToken=0, busyImport=false, trackById=new Map();let busyLibrary=false, loadToken=0, pendingId=null, nextBlob=null, prefetchToken=0, exportURL='';let prefs={};try{prefs=JSON.parse(localStorage.getItem('oto-prefs')||'{}')}catch{};function save(){try{localStorage.setItem('oto-prefs',JSON.stringify(prefs))}catch{}}if(prefs.light)document.body.classList.add('light');function status(t){$('status').textContent=t}function req(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function write(n,fn){return new Promise((res,rej)=>{let tx=db.transaction(n,'readwrite');fn(tx.objectStore(n));tx.oncomplete=res;tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}function meta(t){return {id:t.id,name:t.name,original:t.original||t.name,modified:Number(t.modified)||0,size:t.blob.size,type:t.blob.type||'',fav:!!t.fav}}

function openLibrary(){return new Promise((resolve,reject)=>{let r=indexedDB.open('oto-music',2);r.onblocked=()=>status('請先關閉其他音日分頁，再回到此頁完成升級');r.onerror=()=>reject(r.error);r.onupgradeneeded=e=>{let d=r.result,tx=r.transaction;if(e.oldVersion===0){d.createObjectStore('tracks',{keyPath:'id'});d.createObjectStore('lists',{keyPath:'id'})}let m=d.createObjectStore('meta',{keyPath:'id'});let c=tx.objectStore('tracks').openCursor();c.onsuccess=()=>{let cursor=c.result;if(!cursor)return;try{m.add(meta(cursor.value));cursor.continue()}catch(err){console.error(err);tx.abort()}}};r.onsuccess=()=>resolve(r.result)})}

function id(){return globalThis.crypto?.randomUUID?.()||Date.now()+'-'+Math.random()}function btn(t,fn,cls='tiny'){let b=document.createElement('button');b.textContent=t;b.className=cls;b.onclick=fn;return b}function visible(){let ts=tracks;if(view==='fav')ts=ts.filter(t=>t.fav);else if(view!=='all'){let l=lists.find(l=>l.id===view);ts=(l?.ids||[]).map(i=>trackById.get(i)).filter(Boolean)}let q=$('search').value.toLowerCase();return ts.filter(t=>t.name.toLowerCase().includes(q))}function render(){ $('count').textContent=tracks.length+' 首歌曲 · '+lists.length+' 個播放清單';let n=$('nav');n.replaceChildren();for(let [i,t] of [['all','所有歌曲'],['fav','我的最愛'],...lists.map(l=>[l.id,l.name])])n.append(btn(t,()=>{view=i;limit=100;render()},i===view?'active':''));$('removeList').hidden=['all','fav'].includes(view);let el=$('list');el.replaceChildren();let ts=visible();$('more').hidden=ts.length<=limit;if(!ts.length){let p=document.createElement('p');p.id='empty';p.textContent='這裡還沒有歌曲';el.append(p)}for(let t of ts.slice(0,limit)){let row=document.createElement('div');row.className='track'+(current===t.id?' current':'');row.dataset.id=t.id;let tile=document.createElement('div');tile.className='tile';tile.textContent='♫';let info=document.createElement('div');info.className='info';let name=document.createElement('div');name.className='name';name.textContent=t.name;let sm=document.createElement('small');sm.textContent=(t.size/1048576).toFixed(1)+' MB';info.append(name,sm);info.tabIndex=0;info.setAttribute('role','button');info.onclick=()=>{setQueue(ts.map(x=>x.id),t.id);load(t.id)};info.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();info.click()}};row.append(tile,info,btn(t.fav?'♥':'♡',()=>toggleFav(t.id)),btn('⋯',()=>trackMenu(t)));el.append(row)}updateControls()}function updateControls(){$('fav').textContent=trackById.get(current)?.fav?'♥':'♡';$('shuffle').classList.toggle('active',shuffle);$('repeat').classList.toggle('active',repeat>0);$('repeat').textContent=repeat===2?'↻1':'↻';$('repeat').setAttribute('aria-label',['不循環','循環全部','循環單曲'][repeat]);$('shuffle').setAttribute('aria-pressed',String(shuffle));}function updateCurrent(){for(let row of $('list').children)row.classList.toggle('current',row.dataset.id===current);updateControls()}$('more').onclick=()=>{limit+=100;render()};
function modal(title,content,action){$('dlgTitle').textContent=title;$('dlgBody').replaceChildren(content);dlgAction=action;$('dlg').returnValue='';$('dlg').showModal()}$('dlg').onclose=()=>{if($('dlg').returnValue==='ok')Promise.resolve().then(()=>dlgAction?.()).catch(e=>status(e.message))};function trackMenu(t){if(busyLibrary||busyImport)return;let s=document.createElement('select');s.style.width='100%';for(let [v,l] of [...lists.map(l=>['add:'+l.id,'加入 '+l.name]),...(!['all','fav'].includes(view)?[['remove','從此清單移除']]:[]),['rename','重新命名'],['export','匯出原始音樂檔'],['delete','刪除音樂']]){let o=document.createElement('option');o.value=v;o.textContent=l;s.append(o)}let originView=view;modal(t.name,s,()=>exclusive(async()=>{if(!trackById.has(t.id))return;if(s.value==='export'){let blob=await getBlob(t.id);prepareDownload(blob,t.original||t.name);return}if(s.value==='delete'){if(!confirm('確定刪除此音樂？'))return;let revised=lists.map(l=>({...l,ids:l.ids.filter(i=>i!==t.id)}));await transaction(['tracks','meta','lists'],tx=>{tx.objectStore('tracks').delete(t.id);tx.objectStore('meta').delete(t.id);for(let l of revised)tx.objectStore('lists').put(l)});if(current===t.id||pendingId===t.id)resetPlayer();queue=queue.filter(i=>i!==t.id);queueBase=queueBase.filter(i=>i!==t.id);clearPrefetch()}else if(s.value==='rename'){let n=prompt('歌曲名稱',t.name);if(n?.trim()){let updated={...t,name:n.trim()};await write('meta',o=>o.put(updated));if(current===t.id){$('title').textContent=updated.name;mediaMetadata(updated)}}}else{let l=lists.find(l=>l.id===(s.value==='remove'?originView:s.value.slice(4)));if(l){let updated={...l,ids:s.value==='remove'?l.ids.filter(i=>i!==t.id):[...new Set([...l.ids,t.id])]};await write('lists',o=>o.put(updated))}}await refresh()}))}
async function toggleFav(i){try{await exclusive(async()=>{let t=trackById.get(i);if(t){let updated={...t,fav:!t.fav};await write('meta',o=>o.put(updated));let at=tracks.findIndex(x=>x.id===i);if(at>=0)tracks[at]=updated;trackById.set(i,updated);render()}})}catch(e){status(e.message)}}
$('import').onclick=()=>{if(!busyLibrary&&!busyImport&&db)$('files').click()};
$('files').onchange=async e=>{if(!db||busyLibrary||busyImport){e.target.value='';return status('資料庫尚未就緒或忙碌中')}busyImport=true;setReady(false);let added=0,skipped=0;let key=(name,size,modified)=>JSON.stringify([name,size,modified]);let existing=new Set(tracks.map(t=>key(t.original,t.size,t.modified)));try{if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{});for(let f of e.target.files){let k=key(f.name,f.size,f.lastModified);if(existing.has(k)){skipped++;continue}let t={id:id(),name:f.name.replace(/\.[^.]+$/,'')||f.name,original:f.name,modified:f.lastModified,blob:f,fav:false};await transaction(['tracks','meta'],tx=>{tx.objectStore('tracks').add({id:t.id,blob:f});tx.objectStore('meta').add(meta(t))});existing.add(k);added++;status('已匯入 '+added+' 首')}await refresh();status('已匯入 '+added+' 首，略過 '+skipped+' 首重複檔案')}catch(err){status('匯入中止：'+(err.name==='QuotaExceededError'?'裝置網站儲存空間不足':err.message));try{await refresh()}catch{}}finally{e.target.value='';busyImport=false;setReady(!!db)}};

function load(i){let t=trackById.get(i);if(!t||!db)return;let token=++loadToken;playToken++;let cached=nextBlob?.id===i?nextBlob.blob:null;clearPrefetch();pendingId=i;a.pause();$('title').textContent=t.name;$('sub').textContent='讀取音樂中…';$('play').textContent='…';function attach(blob){if(token!==loadToken)return;let old=url;url=URL.createObjectURL(blob);current=i;pendingId=null;a.src=url;if(old)URL.revokeObjectURL(old);$('sub').textContent='本機音樂';$('play').textContent='▶';mediaMetadata(trackById.get(i)||t);updateCurrent();play();prefetch()}function fail(e){if(token!==loadToken)return;resetPlayer();status('無法讀取音樂：'+e.message)}if(cached){try{attach(cached)}catch(e){fail(e)}}else getBlob(i).then(attach).catch(fail)}

$('seek').oninput=()=>{if(Number.isFinite(a.duration)&&a.duration>0)a.currentTime=a.duration*$('seek').value/100};
function seekTo(s){if(Number.isFinite(s)&&Number.isFinite(a.duration)&&a.duration>0){a.currentTime=Math.max(0,Math.min(s,a.duration));mediaPosition()}}
if('mediaSession'in navigator){for(let [k,f] of Object.entries({play,pause,previoustrack:previous,nexttrack:()=>step(1),seekto:e=>seekTo(e.seekTime),seekbackward:e=>seekTo(a.currentTime-(e.seekOffset||10)),seekforward:e=>seekTo(a.currentTime+(e.seekOffset||10))})){try{navigator.mediaSession.setActionHandler(k,f)}catch{}}}
function checkSleep(){if(!sleepUntil||Date.now()<sleepUntil)return false;sleepUntil=0;clearTimeout(timer);if(pendingId)resetPlayer();else pause();$('sleep').classList.remove('active');status('睡眠定時已結束');return true}
document.addEventListener('visibilitychange',()=>{checkSleep();if(!document.hidden){time();mediaPosition()}});
$('sleep').onclick=()=>{let s=document.createElement('select');for(let m of [0,15,30,45,60,90]){let o=document.createElement('option');o.value=m;o.textContent=m?m+' 分鐘':'關閉定時';s.append(o)}modal('睡眠定時',s,()=>{clearTimeout(timer);let m=Number(s.value);sleepUntil=m?Date.now()+m*60000:0;$('sleep').classList.toggle('active',!!m);if(m)timer=setTimeout(checkSleep,m*60000)})};

function backupStatus(t){$('backupStatus').textContent=t}
function releaseDownload(){if(exportURL)URL.revokeObjectURL(exportURL);exportURL='';$('backupLink').hidden=true;$('backupLink').removeAttribute('href');$('discardBackup').hidden=true}
function prepareDownload(blob,name){releaseDownload();exportURL=URL.createObjectURL(blob);let link=$('backupLink');link.href=exportURL;link.download=name.replace(/[\\/:*?"<>|]/g,'_');link.textContent='下載 '+link.download;link.hidden=false;$('discardBackup').hidden=false;$('backupPanel').open=true;backupStatus('檔案已準備完成，請點選下載並儲存至「檔案」或其他備份位置。')}
$('discardBackup').onclick=()=>{releaseDownload();backupStatus('已釋放暫存；請確認備份已儲存。')};
const ZIP_LIMIT=0xffffffff, enc=new TextEncoder(), dec=new TextDecoder('utf-8',{fatal:true});
const crcTable=Uint32Array.from({length:256},(_,i)=>{for(let j=0;j<8;j++)i=(i&1)?(0xedb88320^(i>>>1)):(i>>>1);return i>>>0});
async function crc32(blob){let c=0xffffffff;for(let pos=0;pos<blob.size;pos+=1048576){let bytes=new Uint8Array(await blob.slice(pos,pos+1048576).arrayBuffer());for(let b of bytes)c=crcTable[(c^b)&255]^(c>>>8)}return (c^0xffffffff)>>>0}
function header(n){let bytes=new Uint8Array(n),v=new DataView(bytes.buffer);return {bytes,u16:(p,x)=>v.setUint16(p,x,true),u32:(p,x)=>v.setUint32(p,x,true)}}
async function zipStore(entries,onProgress=()=>{}){if(entries.length>65535)throw Error('ZIP 檔案數量超過上限');let parts=[],central=[],offset=0,cs=0;for(let i=0;i<entries.length;i++){let {name,blob}=entries[i],nb=enc.encode(name);if(nb.length>65535||blob.size>=ZIP_LIMIT)throw Error('單一檔案超過 ZIP 上限');let crc=await crc32(blob),l=header(30),c=header(46);l.u32(0,0x04034b50);l.u16(4,20);l.u16(6,0x800);l.u16(12,33);l.u32(14,crc);l.u32(18,blob.size);l.u32(22,blob.size);l.u16(26,nb.length);c.u32(0,0x02014b50);c.u16(4,20);c.u16(6,20);c.u16(8,0x800);c.u16(14,33);c.u32(16,crc);c.u32(20,blob.size);c.u32(24,blob.size);c.u16(28,nb.length);c.u32(42,offset);parts.push(l.bytes,nb,blob);central.push(c.bytes,nb);offset+=30+nb.length+blob.size;cs+=46+nb.length;if(offset+cs+22>=ZIP_LIMIT)throw Error('備份接近 4 GiB 上限，請改為單首匯出或分批整理');onProgress(i+1,entries.length)}let end=header(22);end.u32(0,0x06054b50);end.u16(8,entries.length);end.u16(10,entries.length);end.u32(12,cs);end.u32(16,offset);return new Blob([...parts,...central,end.bytes],{type:'application/zip'})}
async function readBytes(file,offset,n){if(!Number.isSafeInteger(offset)||!Number.isSafeInteger(n)||offset<0||n<0||offset+n>file.size)throw Error('ZIP 已損毀或不完整');return new Uint8Array(await file.slice(offset,offset+n).arrayBuffer())}
const dataView=b=>new DataView(b.buffer,b.byteOffset,b.byteLength);
async function parseZip(file){if(file.size<22||file.size>=ZIP_LIMIT)throw Error('不支援此 ZIP 大小');let tail=await readBytes(file,file.size-22,22),ev=dataView(tail);if(ev.getUint32(0,true)!==0x06054b50||ev.getUint16(4,true)||ev.getUint16(6,true)||ev.getUint16(20,true))throw Error('請選擇 Oto 建立的原始 ZIP 備份');let count=ev.getUint16(10,true),size=ev.getUint32(12,true),pos=ev.getUint32(16,true),start=pos;if(ev.getUint16(8,true)!==count||size>64*1048576||pos+size!==file.size-22)throw Error('ZIP 目錄不完整');let directory=await readBytes(file,pos,size),v=dataView(directory),p=0,files=new Map();for(let i=0;i<count;i++){if(p+46>size||v.getUint32(p,true)!==0x02014b50)throw Error('ZIP 目錄損毀');let flags=v.getUint16(p+8,true),method=v.getUint16(p+10,true),crc=v.getUint32(p+16,true),n=v.getUint32(p+20,true),raw=v.getUint32(p+24,true),nl=v.getUint16(p+28,true),extra=v.getUint16(p+30,true),comment=v.getUint16(p+32,true),off=v.getUint32(p+42,true);if(flags!==0x800||method!==0||n!==raw||p+46+nl+extra+comment>size||v.getUint16(p+34,true))throw Error('僅支援 Oto 原始未壓縮 ZIP');let name=dec.decode(directory.subarray(p+46,p+46+nl));if(files.has(name))throw Error('ZIP 有重複檔案');let local=dataView(await readBytes(file,off,30));if(local.getUint32(0,true)!==0x04034b50||local.getUint16(6,true)!==flags||local.getUint16(8,true)!==method||local.getUint32(14,true)!==crc||local.getUint32(18,true)!==n||local.getUint32(22,true)!==n)throw Error('ZIP 標頭不一致');let ln=local.getUint16(26,true),le=local.getUint16(28,true),data=off+30+ln+le;if(data+n>start||dec.decode(await readBytes(file,off+30,ln))!==name)throw Error('ZIP 檔案位置錯誤');files.set(name,{blob:file.slice(data,data+n),crc});p+=46+nl+extra+comment}if(p!==size)throw Error('ZIP 目錄長度不符');return files}
function safeName(s){return String(s||'audio').replace(/[\\/:*?"<>|\u0000-\u001f]/g,'_').slice(0,160)||'audio'}
async function snapshot(){let tx=db.transaction(['meta','lists','tracks'],'readonly'),ms=tx.objectStore('meta'),ls=tx.objectStore('lists'),ts=tx.objectStore('tracks');return new Promise((resolve,reject)=>{let m,l,entries=[];tx.onabort=()=>reject(tx.error||Error('無法讀取音樂庫'));tx.onerror=()=>{};tx.oncomplete=()=>resolve({m,l,entries});let r=ms.getAll(),q=ls.getAll();q.onsuccess=()=>{l=q.result};r.onsuccess=()=>{m=r.result;try{for(let t of m){let s=ts.get(t.id);s.onsuccess=()=>{let blob=s.result?.blob;if(!(blob instanceof Blob)||blob.size!==t.size){tx.abort();return}entries.push({id:t.id,blob})}}}catch{tx.abort()}}})}
async function makeBackup(){releaseDownload();backupStatus('正在讀取音樂庫…');let {m,l,entries}=await snapshot(),byId=new Map(entries.map(x=>[x.id,x.blob]));let manifest={format:'oto-library',version:1,tracks:m.map((t,i)=>({...t,path:'music/'+String(i+1).padStart(5,'0')+'_'+safeName(t.original)})),lists:l};let zipEntries=[{name:'oto-library.json',blob:new Blob([JSON.stringify(manifest)],{type:'application/json'})},...manifest.tracks.map(t=>({name:t.path,blob:byId.get(t.id)}))];let estimated=zipEntries.reduce((s,x)=>s+x.blob.size+76+2*enc.encode(x.name).length,22);if(estimated>=ZIP_LIMIT)throw Error('音樂庫超過單一 ZIP 4 GiB 上限，請先使用單首匯出');let zip=await zipStore(zipEntries,(i,n)=>backupStatus('正在製作備份 '+i+' / '+n));prepareDownload(zip,'Oto-'+new Date().toISOString().slice(0,10)+'.zip')}
function validateManifest(m,files){const validId=x=>typeof x==='string'&&x.length>0&&x.length<=256, str=x=>typeof x==='string'&&x.length<=4096;if(m?.format!=='oto-library'||m.version!==1||!Array.isArray(m.tracks)||!Array.isArray(m.lists)||m.tracks.length>65534||m.lists.length>65535)throw Error('不支援的 Oto 備份格式');let ids=new Set(),paths=new Set(),listIds=new Set();for(let t of m.tracks){if(!t||!validId(t.id)||ids.has(t.id)||!str(t.name)||!str(t.original)||!str(t.type)||!Number.isSafeInteger(t.size)||t.size<0||!Number.isFinite(t.modified)||typeof t.fav!=='boolean'||typeof t.path!=='string'||!t.path.startsWith('music/')||paths.has(t.path)||!files.has(t.path)||files.get(t.path).blob.size!==t.size)throw Error('歌曲資訊不完整');ids.add(t.id);paths.add(t.path)}for(let l of m.lists){if(!l||!validId(l.id)||['all','fav'].includes(l.id)||listIds.has(l.id)||!str(l.name)||!Array.isArray(l.ids)||l.ids.some(i=>!ids.has(i)))throw Error('播放清單資訊不完整');listIds.add(l.id)}if(files.size!==paths.size+1)throw Error('ZIP 有未識別的檔案')}
async function restoreBackup(file){backupStatus('檢查備份格式…');let files=await parseZip(file),entry=files.get('oto-library.json');if(!entry||entry.blob.size>32*1048576||await crc32(entry.blob)!==entry.crc)throw Error('備份索引不存在或已損毀');let m=JSON.parse(await entry.blob.text());validateManifest(m,files);for(let [i,t] of m.tracks.entries()){let e=files.get(t.path);if(await crc32(e.blob)!==e.crc)throw Error('檔案損毀：'+t.name);backupStatus('驗證歌曲 '+(i+1)+' / '+m.tracks.length)}if(!confirm('已驗證 '+m.tracks.length+' 首歌曲及 '+m.lists.length+' 個清單。還原會加入新副本，不會刪除現有音樂；重複還原會產生副本。繼續？')){backupStatus('已取消，音樂庫未修改');return}let mapping=new Map(),newTracks=m.tracks.map(t=>{let {path,...rest}=t;let i=id();mapping.set(t.id,i);return {meta:{...rest,id:i},blob:files.get(path).blob.slice(0,t.size,t.type)}}),newLists=m.lists.map(l=>({id:id(),name:l.name,ids:l.ids.map(i=>mapping.get(i))}));backupStatus('正在還原音樂庫…');await transaction(['tracks','meta','lists'],tx=>{for(let t of newTracks){tx.objectStore('tracks').add({id:t.meta.id,blob:t.blob});tx.objectStore('meta').add(t.meta)}for(let l of newLists)tx.objectStore('lists').add(l)});await refresh();backupStatus('還原完成：'+newTracks.length+' 首歌曲、'+newLists.length+' 個清單；原有音樂保留。')}
function backupError(e){backupStatus('作業未完成：'+(e.name==='QuotaExceededError'?'裝置空間不足，未完成的還原已取消':e.message))}
$('backup').onclick=()=>exclusive(makeBackup).catch(backupError);
$('restore').onclick=()=>{if(db&&!busyLibrary&&!busyImport)$('restoreFile').click()};
$('restoreFile').onchange=e=>{let file=e.target.files[0];e.target.value='';if(file)exclusive(()=>restoreBackup(file)).catch(backupError)};

$('theme').onclick=()=>{prefs.light=document.body.classList.toggle('light');save()};init();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{reg.update().catch(()=>{});const notify=()=>{if(navigator.serviceWorker.controller)status('新版已準備完成，下次重新開啟音日即可使用')};reg.addEventListener('updatefound',()=>{const worker=reg.installing;worker?.addEventListener('statechange',()=>{if(worker.state==='installed')notify()})})}).catch(()=>status('離線快取尚未成功，請確認 HTTPS 環境'));
